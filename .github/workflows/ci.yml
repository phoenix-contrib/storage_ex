name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test

jobs:
  test:
    name: Test (Full Features - with analyzer dependencies)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storage_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"

      - name: Cache Mix dependencies
        uses: actions/cache@v5
        with:
          path: |
            packages/*/deps
            packages/*/_build
          key: ${{ runner.os }}-mix-1.16-26-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-1.16-26-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install analyzer and previewer dependencies (libvips, ffmpeg, poppler, mupdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev ffmpeg poppler-utils mupdf-tools

      - name: Install dependencies
        run: make deps

      - name: Compile project
        run: make compile

      - name: Check formatting
        run: make format-check

      - name: Run tests (full analyzer functionality)
        run: |
          set -e
          make test
        env:
          MIX_ENV: test

  test-unavailable-tools:
    name: Test (Unavailable Tools - graceful degradation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"

      - name: Cache Mix dependencies
        uses: actions/cache@v5
        with:
          path: |
            packages/*/deps
            packages/*/_build
          key: ${{ runner.os }}-mix-unavailable-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-unavailable-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      # NOTE: Intentionally NOT installing ffmpeg, poppler, mupdf, libvips
      # This tests graceful degradation when tools are unavailable

      - name: Install dependencies
        run: make deps

      - name: Compile project
        run: make compile

      - name: Run tests (unavailable tools - graceful degradation)
        run: |
          set -e
          make test.unavailable_tools
        env:
          MIX_ENV: test

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"

      - name: Cache Mix dependencies
        uses: actions/cache@v5
        with:
          path: |
            packages/*/deps
            packages/*/_build
          key: ${{ runner.os }}-mix-quality-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-quality-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: make deps

      - name: Compile project
        run: make compile

      - name: Run Credo
        run: make lint-strict

      - name: Cache PLT files
        uses: actions/cache@v5
        with:
          path: |
            priv/plts
            packages/*/priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-

      - name: Create PLT directories
        run: |
          mkdir -p priv/plts/core
          mkdir -p packages/storage_ex/priv/plts
          mkdir -p packages/storage_ex_s3/priv/plts
          mkdir -p packages/storage_ex_ecto/priv/plts

      - name: Run Dialyzer
        run: make dialyzer

  documentation:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"

      - name: Cache Mix dependencies
        uses: actions/cache@v5
        with:
          path: |
            packages/*/deps
            packages/*/_build
          key: ${{ runner.os }}-mix-docs-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-docs-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: make deps

      - name: Generate documentation
        run: make docs

      - name: Check for documentation warnings
        run: |
          if make docs 2>&1 | grep -q "warning:"; then
            echo "Documentation has warnings"
            make docs
            exit 1
          fi
